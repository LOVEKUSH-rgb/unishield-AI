# UniShield AI — docker-compose (Development)
# Used for local development with exposed database ports and reload features.

version: "3.9"

networks:
  unishield-frontend:
    driver: bridge
  unishield-backend:
    driver: bridge

services:
  unishield-api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - ./data:/app/data
    environment:
      - ENVIRONMENT=development
      - LOG_LEVEL=DEBUG
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - unishield-frontend
      - unishield-backend

  postgres:
    image: postgres:15-alpine
    ports:
      - "5432:5432" # Exposed for local DB inspection
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-unishield}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-unishield}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - unishield-backend

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379" # Exposed for local inspection
    command: redis-server --requirepass ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - unishield-backend

  unishield-dashboard:
    build: 
      context: .
      dockerfile: docker/Dockerfile.dashboard
    container_name: unishield-dashboard
    depends_on:
      - unishield-api
    ports:
      - "8501:8501"
    volumes:
      - .:/app
    environment:
      - API_URL=http://unishield-api:8000
    networks:
      - unishield-frontend
    
  zeek:
    image: zeek/zeek:latest
    container_name: unishield-zeek
    volumes:
      - ./data/samples/zeek_logs:/var/log/zeek
    command: ["zeek", "-i", "eth0", "LogAscii::use_json=T"]
    networks:
      - unishield-backend

volumes:
  pgdata:
