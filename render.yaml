services:
  - type: web
    name: unishield-api
    env: docker
    dockerfilePath: Dockerfile
    plan: free
    healthCheckPath: /health/live
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: unishield-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      # Redis is omitted to keep the deployment completely FREE.
      # The app will automatically use the built-in FakeRedis fallback!

  - type: web
    name: unishield-dashboard
    env: docker
    dockerfilePath: docker/Dockerfile.dashboard
    plan: free
    envVars:
      - key: API_URL
        # Note: Render will dynamically generate a URL for the API, 
        # but you may need to update this variable in the Render Dashboard 
        # to match the exact URL given to unishield-api.
        value: https://unishield-api.onrender.com

databases:
  - name: unishield-db
    plan: free
