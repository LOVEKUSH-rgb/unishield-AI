# UniShield AI — docker-compose
# Phase 23: Production Isolation & Security Hardening

version: "3.9"

networks:
  unishield-frontend:
    driver: bridge
  unishield-backend:
    driver: bridge

services:
  # Core detection engine
  unishield-api:
    build: .
    command: >
      sh -c "alembic upgrade head && uvicorn src.api.app:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - JWT_ALGORITHM=${JWT_ALGORITHM:-HS256}
      - JWT_ACCESS_TOKEN_EXPIRE_MINUTES=${JWT_ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:8501}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - unishield-frontend
      - unishield-backend

  # PostgreSQL for persistent storage (Not exposed to host)
  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-unishield}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-unishield}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - unishield-backend

  # Redis for ephemeral state (Not exposed to host, requires Auth)
  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - unishield-backend

  # Streamlit dashboard
  unishield-dashboard:
    build: 
      context: .
      dockerfile: docker/Dockerfile.dashboard
    container_name: unishield-dashboard
    depends_on:
      - unishield-api
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://unishield-api:8000
    restart: unless-stopped
    networks:
      - unishield-frontend
    
  zeek:
    image: zeek/zeek:latest
    container_name: unishield-zeek
    volumes:
      - ./data/samples/zeek_logs:/var/log/zeek
    command: ["zeek", "-i", "eth0", "LogAscii::use_json=T"]
    restart: unless-stopped
    networks:
      - unishield-backend

  prometheus:
    image: prom/prometheus:v2.45.0
    container_name: unishield-prometheus
    volumes:
      - ./monitoring/prometheus:/etc/prometheus
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    restart: unless-stopped
    networks:
      - unishield-backend

  grafana:
    image: grafana/grafana:10.1.2
    container_name: unishield-grafana
    depends_on:
      - prometheus
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:-UniShieldSecureP@ssw0rd}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards
      - grafana_data:/var/lib/grafana
    restart: unless-stopped
    networks:
      - unishield-backend
      - unishield-frontend

volumes:
  pgdata:
  prometheus_data:
  grafana_data:
